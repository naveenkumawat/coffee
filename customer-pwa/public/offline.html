<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c5a3b" />
    <meta name="robots" content="noindex" />
    <title>Offline | The88Coffees</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7f3ee 0%, #efe2cf 100%);
        color: #1c1917;
        font-family: Poppins, system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.6;
        color: #6b635c;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 1.35rem;
        background: #7c5a3b;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #7c5a3b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        The88Coffees may still open from your device, but live menu, cart, checkout, and orders need a
        connection. Cached screens are not the latest cafe data.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
